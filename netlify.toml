# Netlify: install dependencies, build with Vite and publish the static site in dist/
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs Node 20.19+ or 22.12+
  NODE_VERSION = "22"

# Vite fingerprints every file in /assets, so browsers can cache them for good
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
